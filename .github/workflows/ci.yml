name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install CGO dependencies (sqlite3)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test -v -race ./...

  test-ortools:
    name: Go Tests (OR-Tools CP-SAT)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install CGO dependencies (sqlite3 + C++ binding)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libc6-dev
      - name: Build OR-Tools C++ binding
        run: bash scripts/build_ortools.sh
      - name: Go vet (ortools)
        run: go vet -tags ortools ./...
      - name: Go test (ortools)
        run: go test -v -race -tags ortools ./...
        env:
          # Тестовый бинарник живёт вне дерева репозитория, rpath $ORIGIN
          # не покрывает его — библиотеку указываем явно.
          LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/ortools/lib

  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  lint:
    name: Go Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Check gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Files not formatted:"
            echo "$out"
            exit 1
          fi
